name: Rights

on:
  push:
    branches: [kurtz, main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rights:
    name: Rights and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test fail-closed dependency checks
        run: python3 -m unittest discover -s Tools/licensing/tests -v
      - name: Check rights and exact dependency inputs
        run: python3 Tools/licensing/verify-rights.py
